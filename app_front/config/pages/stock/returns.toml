# ------------------------------------------------------------------------------
# --- Configuration page de retour fournisseur                               ---
# ------------------------------------------------------------------------------
# Paramètres
[params]
tab = "Stock"
styles = [
    "css/main.css",
    "css/stock/order.css"
]
scripts = [
    "js/main.js",
]
# Clées
[meta]
title = "Stock | Intranet"
description = "Page de gestion des retours fournisseurs de l'intranet Sauvetage"
keywords = "stock, retour, fournisseur, intranet"
author = "Rémi Verschuur"
robots = "noindex, nofollow"
[meta.accessibility]
lang="fr"
direction="ltr"
aria_role="main"
# Pages spécifiques
[layout]
main_layout = "stock/returns.html"
extend_layout = "index.html"
# Flags pour afficher ou non les éléments sur les commons
[flags]
navbar = true
searchbar = false
userbar = true
htmx = true
