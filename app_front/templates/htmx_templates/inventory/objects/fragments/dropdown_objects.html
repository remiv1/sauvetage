<!-- template dropdown_objects.html -->
<ul id="objects-results">
    {% if not items %}
        <li>Aucun résultat trouvé.</li>
    {% endif %}
    {% for i in items %}
        <li class="dropdown-item"
            data-object-id="{{ i.id }}"
            data-object-name="{{ i.name }}"
            data-inventory-price="{{ i.inventory_price | float if i.inventory_price is defined else 0 }}"
            data-available-quantity="{{ i.available_quantity if i.available_quantity is defined else 0 }}"
            data-purchase-price="{{ i.purchase_price | float if i.purchase_price else 0 }}"
            data-selling-prices='{{ i.selling_prices | tojson }}'
            style="cursor:pointer">
            {{ i.name }}
            <small class="text-muted"> — EAN : {{ i.ean13 }}</small>
        </li>
    {% endfor %}
</ul>
<script>
(function() {
    const reservationMode = {{ 'true' if reservation else 'false' }};

    document.querySelectorAll('#objects-results .dropdown-item').forEach(function(item) {
        item.addEventListener('click', function() {
            var objId = this.dataset.objectId;
            var objName = this.dataset.objectName;
            var inventoryPrice = this.dataset.inventoryPrice;
            var availableQty = this.dataset.availableQuantity;
            var purchasePrice = this.dataset.purchasePrice;
            var sellingPrices = JSON.parse(this.dataset.sellingPrices || '[]');
            var idField = document.getElementById('general_object_id');
            var nameField = document.getElementById('object-wrapper');
            var quantityField = document.getElementById('quantity');
            if (idField) idField.value = objId;
            if (nameField) nameField.value = objName;
            if (typeof window.setOrderLinePrices === 'function') {
                window.setOrderLinePrices(sellingPrices, inventoryPrice || purchasePrice || 0);
            }
            if (quantityField) {
                quantityField.min = '0';

                if (reservationMode) {
                    const maxQty = Number(availableQty || 0);
                    quantityField.setAttribute('max', maxQty > 0 ? String(maxQty) : '');
                    if (!quantityField.value || Number(quantityField.value) > maxQty) {
                        quantityField.value = maxQty > 0 ? '1' : '';
                    }
                    const stockHelp = document.getElementById('quantity-stock-help');
                    if (stockHelp) {
                        stockHelp.textContent = `Stock disponible : ${maxQty}`;
                        stockHelp.classList.toggle('text-danger', maxQty === 0);
                        stockHelp.classList.toggle('text-muted', maxQty !== 0);
                    }
                } else {
                    quantityField.removeAttribute('max');
                }
            }
            var results = document.getElementById('article-search-results');
            if (results) results.innerHTML = '';
        });
    });
})();
</script>
