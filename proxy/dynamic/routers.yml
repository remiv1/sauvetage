http:
  routers:
    catch-all:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: app-front
      middlewares:
        - no-robots
      tls:
        certResolver: letsencrypt

    redirect-http-to-https:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: noop

    # Limite les appels sur l'endpoint de login
    login-rate-limit:
      rule: "Path(`/user/login`)"
      priority: 500
      entryPoints:
        - websecure
      middlewares:
        - login-rate-limit
        - no-robots
      service: app-front
      tls:
        certResolver: letsencrypt

    internal-editions-host:
      rule: "Host(`internal.editions-sauvetage.fr`)"
      entryPoints:
        - websecure
      service: app-front
      middlewares:
        - no-robots
      tls:
        certResolver: letsencrypt

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    app-front:
      loadBalancer:
        servers:
          - url: "http://sauv-app:5000"

    noop:
      loadBalancer:
        servers:
          - url: "http://localhost"